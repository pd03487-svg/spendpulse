<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#iconGrad)" stroke-width="12" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Card Graphic -->
  <g transform="translate(106, 126)">
    <!-- Background Card -->
    <rect width="300" height="200" rx="28" fill="url(#iconGrad)" opacity="0.9" />
    
    <!-- Card Chip / Accents -->
    <rect x="36" y="36" width="48" height="36" rx="8" fill="rgba(255,255,255,0.3)" />
    
    <!-- Trending Up Path -->
    <path d="M 40 140 L 110 90 L 170 120 L 260 50" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="260,35 260,65 235,50" fill="#ffffff" />
    
    <!-- Small Dots -->
    <circle cx="110" cy="90" r="7" fill="#ffffff" />
    <circle cx="170" cy="120" r="7" fill="#ffffff" />
  </g>

  <!-- Bottom Pulse Pill -->
  <g transform="translate(156, 360)">
    <rect width="200" height="48" rx="24" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="4" />
    <text x="100" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">SPENDPULSE</text>
  </g>
</svg>
